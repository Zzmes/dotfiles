format="""
$directory$git_branch$git_status$python$conda$rust$cmd_duration$status
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
surface0 = "#313244"
base = "#1e1e2e"

[os]
format ="[$symbol]($style)"
style = "fg:sapphire"
disabled = false
[os.symbols]
Macos = " "
Ubuntu = " "
Windows = " "

[directory]
truncation_length = 3
style = "fg:sky"
format = "[$read_only$path]($style) "
read_only = " "

[git_branch]
symbol = ""
style = "fg:green"
format = "[$symbol $branch]($style) "

[git_status]
style = "fg:yellow"
format = "[$all_status]($style) "

[nodejs]
symbol = ""
style = "fg:yellow"
format = "[$symbol $version]($style) "

[python]
symbol = ""
style = "fg:yellow"
format = "[$symbol $version]($style) "

[rust]
symbol = ""
style = "fg:yellow"
format = "[$symbol $version]($style) "

[cmd_duration]
format = " took [$duration]($style) "
style = "fg:lavender"
min_time = 100

[status]
style = "fg:red"
symbol = "✘"
success_symbol = ""
format = "[$symbol $status]($style) "

[time]
disabled = false
style = "fg:subtext1"
format = "[$time ]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[✘](bold fg:red)"

[conda]
symbol = " "      # 或者你喜欢的符号
style = "fg:mauve"
format = "[$symbol$environment]($style)"
ignore_base = false   # 是否忽略 base 环境，false 表示显示    
